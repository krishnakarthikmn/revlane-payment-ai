name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: revlane
          POSTGRES_PASSWORD: revlane
          POSTGRES_DB: revlane
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U revlane -d revlane"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://revlane:revlane@localhost:5432/revlane
      LLM_STUB: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: |
          cd apps/api && uv sync
          cd ../web && npm ci
      - name: Migrate
        run: make migrate
      - name: Lint and test
        run: make lint test
      - name: Evaluate
        run: make eval
