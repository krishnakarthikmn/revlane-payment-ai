[project]
name = "revlane-api"
version = "0.1.0"
description = "Revlane API: connectors, engines, harness and chat"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "pyyaml>=6",
    "anthropic>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["revlane"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "SIM", "ANN"]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["ANN", "E501", "I001"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["revlane", "tests", "evals"]
plugins = ["pydantic.mypy"]
